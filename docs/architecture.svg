<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Cyber Advisor architecture</title>
<desc>A browser calls a FastAPI backend, which runs an agent loop. The agent calls an LLM proxy and picks one of two tools: document search over NIST publications, or guarded SQL over the CISA KEV table.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="620" fill="#FFFFFF"/>
<rect x="150" y="24" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="290.0" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Browser UI</text>
<text x="290.0" y="62" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">web/index.html, web/app.js</text>
<rect x="150" y="124" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="290.0" y="142" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">FastAPI backend</text>
<text x="290.0" y="162" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">app/main.py, streams SSE</text>
<rect x="150" y="224" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="290.0" y="242" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Agent loop</text>
<text x="290.0" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">app/agent.py, step cap</text>
<rect x="490" y="224" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="565.0" y="242" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">LLM proxy</text>
<text x="565.0" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">chat + embeddings</text>
<rect x="50" y="324" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="160.0" y="342" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">search_docs</text>
<text x="160.0" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">app/retrieval.py</text>
<rect x="310" y="324" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="420.0" y="342" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">query_kev</text>
<text x="420.0" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">app/sqlguard.py</text>
<rect x="50" y="424" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="160.0" y="442" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Hybrid retrieval</text>
<text x="160.0" y="462" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">BM25 + dense, floor</text>
<rect x="310" y="424" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="420.0" y="442" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">SQL guard</text>
<text x="420.0" y="462" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">SELECT-only, row cap</text>
<rect x="50" y="524" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="160.0" y="542" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">NIST publications</text>
<text x="160.0" y="562" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">12 PDFs, public domain</text>
<rect x="310" y="524" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="420.0" y="542" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">CISA KEV table</text>
<text x="420.0" y="562" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">1,754 rows, CC0</text>
<line x1="260" y1="80" x2="260" y2="122" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="320" y1="124" x2="320" y2="82" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="290" y1="180" x2="290" y2="222" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="432" y1="252" x2="488" y2="252" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="230" y1="280" x2="162" y2="322" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="350" y1="280" x2="418" y2="322" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="160" y1="380" x2="160" y2="422" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="420" y1="380" x2="420" y2="422" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="160" y1="480" x2="160" y2="522" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="420" y1="480" x2="420" y2="522" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="250" y="102" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">POST /api/ask</text>
<text x="330" y="102" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">SSE events</text>
</svg>
